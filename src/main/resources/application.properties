spring.datasource.url=${LEGACYPAY_DB_URL:jdbc:postgresql://localhost:5432/legacypay}
spring.datasource.username=${LEGACYPAY_DB_USERNAME:legacypay}
spring.datasource.password=${LEGACYPAY_DB_PASSWORD:legacypay}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
legacypay.security.username=${LEGACYPAY_APP_USERNAME:dev-client}
legacypay.security.password=${LEGACYPAY_APP_PASSWORD:dev-password}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
legacypay.kafka.enabled=${LEGACYPAY_KAFKA_ENABLED:false}
legacypay.kafka.payment-events-topic=${LEGACYPAY_KAFKA_PAYMENT_EVENTS_TOPIC:legacypay.payment-events}
spring.kafka.bootstrap-servers=${LEGACYPAY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=legacypay
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.legacypay.events
