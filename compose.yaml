services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${LEGACYPAY_DB_NAME:-legacypay}
      POSTGRES_USER: ${LEGACYPAY_DB_USERNAME:-legacypay}
      POSTGRES_PASSWORD: ${LEGACYPAY_DB_PASSWORD:-legacypay}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  legacypay:
    build: .
    environment:
      LEGACYPAY_DB_URL: jdbc:postgresql://postgres:5432/legacypay
      LEGACYPAY_DB_USERNAME: ${LEGACYPAY_DB_USERNAME:-legacypay}
      LEGACYPAY_DB_PASSWORD: ${LEGACYPAY_DB_PASSWORD:-legacypay}
      LEGACYPAY_APP_USERNAME: ${LEGACYPAY_APP_USERNAME:-dev-client}
      LEGACYPAY_APP_PASSWORD: ${LEGACYPAY_APP_PASSWORD:-dev-password}
      LEGACYPAY_KAFKA_ENABLED: "true"
      LEGACYPAY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  postgres-data:
